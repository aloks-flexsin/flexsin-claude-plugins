<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design: Sign in – Central</title>
<link rel="stylesheet" href="central.css">
</head>
<body>
<!-- Approved design for the central service (sidebar redesign). Static mock-up with example data; not used by the app.
     All design pages: index.html. -->
<div class="app light" id="app">
  <header class="auth-top">
    <a class="brand" href="#">auto-runner <span>central</span></a>
    <div class="mini-seg" role="group" aria-label="Theme"><button type="button" data-theme="light" aria-pressed="true">Light</button><button type="button" data-theme="dark" aria-pressed="false">Dark</button></div>
  </header>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Sign in</h1>
      <form class="panel">
        <div data-if="error" hidden><p class="impact" role="alert" style="font-size: 13px">Wrong email or password. After 5 wrong tries an account waits 15 minutes before it can sign in again.</p></div>
        <div class="field"><label for="si-email">Email</label><input id="si-email" type="email" autocomplete="username" placeholder="name@company.com"></div>
        <div class="field"><label for="si-pw">Password</label><div class="pw-field"><input id="si-pw" type="password" autocomplete="current-password"><button class="btn" type="button">Show</button></div></div>
        <button class="btn primary wide" type="button">Sign in</button>
      </form>
      <p class="auth-note">No account? Ask a project owner to invite you.<br>Forgot your password? Ask an admin for a reset link.</p>
    </div>
  </div>
</div>
<script>
(function () {
  var cfg = {"groups": {}, "acts": {}};
  var app = document.getElementById('app');
  function press(sel, btn) { document.querySelectorAll(sel).forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); }); }
  document.querySelectorAll('[data-theme]').forEach(function (b) {
    b.addEventListener('click', function () { app.className = 'app ' + b.getAttribute('data-theme'); press('[data-theme]', b); });
  });
  document.querySelectorAll('[data-act]').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = cfg.acts[b.getAttribute('data-act')];
      if (!a) return;
      if (a[0] === 'toggle') {
        var el = document.querySelector('[data-if="' + a[1] + '"]');
        el.hidden = !el.hidden;
        document.querySelectorAll('[aria-expanded]').forEach(function (x) { if (cfg.acts[x.getAttribute('data-act')] === a) x.setAttribute('aria-expanded', el.hidden ? 'false' : 'true'); });
      } else if (a[0] === 'filter') {
        document.querySelectorAll('[data-kind]').forEach(function (li) { li.hidden = a[1] !== 'all' && li.getAttribute('data-kind') !== a[1]; });
        press('[data-act^="f"]', b);
      } else {
        (cfg.groups[a[0]] || []).forEach(function (c) { var el = document.querySelector('[data-if="' + c + '"]'); if (el) el.hidden = c !== a[1]; });
        document.querySelectorAll('[data-act]').forEach(function (x) { var xa = cfg.acts[x.getAttribute('data-act')]; if (xa && xa[0] === a[0] && x.hasAttribute('aria-pressed')) x.setAttribute('aria-pressed', xa[1] === a[1] ? 'true' : 'false'); });
      }
    });
  });
})();
</script>
</body>
</html>
