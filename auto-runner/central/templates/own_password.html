{% extends "base.html" %}
{% block title %}Change your password{% endblock %}
{% block content %}
<h1>Change your password</h1>
<p>Changing it signs you out everywhere, including here.</p>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('admin.own_password_post') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Current password <input type="password" name="current_password" autocomplete="current-password" required></label>
  <label>New password <input type="password" name="new_password" autocomplete="new-password" required></label>
  <label>New password again <input type="password" name="confirm_password" autocomplete="new-password" required></label>
  <button type="submit">Change password</button>
</form>
<p><a href="{{ url_for('auth.home') }}">Home</a></p>
{% endblock %}
